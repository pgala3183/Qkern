[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qkern"
version = "0.0.1"
description = "Architecture-aware quantized CUDA kernels and autotuning for LLM inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pgala3183" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
torch = [
  "torch>=2.1",
]

[project.scripts]
qkern-diagnostics = "qkern.diagnostics:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
